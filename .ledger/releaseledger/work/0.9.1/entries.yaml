entries:
  - kind: added
    summary:
      Added support for application-defined audio URIs and strict playback attribute
      validation
    body: >-
      Audio source values may use application-specific URI schemes and pass through
      parsing, canonical SSMD formatting, and generic SSML rendering without SSMD
      attempting to resolve them. Audio playback attributes receive value-specific
      validation, and empty audio annotations remain available as zero-width spans in
      parsed structures.
    status: accepted
