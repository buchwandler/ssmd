name: Codecov

on:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install base runtime and coverage tools
        run: python -m pip install -e ".[dev]"
      - name: Generate coverage report
        run: python -m pytest --cov=ssmd --cov-branch --cov-report=xml
      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: buchwandler/ssmd
