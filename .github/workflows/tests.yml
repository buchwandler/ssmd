name: Test SSMD

on:
  push:
  pull_request:

jobs:
  base:
    name: Base runtime (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install base runtime and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov
      - name: Run base suite without spaCy
        run: python -m pytest -q

  minimum:
    name: Minimum supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependency floor
        run: |
          python -m pip install --upgrade pip
          python -m pip install "phrasplit==0.3.4" "pyyaml==6.0" "typer" "click" pytest
          python -m pip install -e . --no-deps
      - name: Run dependency-floor suite without spaCy
        run: python -m pytest -q

  spacy:
    name: Optional spaCy integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install spaCy extra and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[spacy,dev]"
          python -m spacy download en_core_web_sm
      - name: Run spaCy suite
        run: python -m pytest -q

  quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy ssmd
      - name: Compile sources
        run: python -m compileall -q ssmd

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install documentation tools
        run: python -m pip install -e ".[docs]"
      - name: Build documentation
        run: python -m sphinx --keep-going -b html docs docs/_build/html

  package:
    name: Package and installed-wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build artifacts
        run: python -m build
      - name: Validate artifact metadata
        run: python -m twine check dist/*
      - name: Inspect package artifacts
        run: python tools/check_artifacts.py dist/*
      - name: Verify release artifact version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/check_release_version.py --expected "${RELEASE_TAG}" dist/*
      - name: Installed-wheel smoke
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/ssmd-wheel-smoke"
          "${RUNNER_TEMP}/ssmd-wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/ssmd-wheel-smoke/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.resources
          import json
          import subprocess
          import sys
          from pathlib import Path

          import ssmd

          distribution_version = importlib.metadata.version("ssmd")
          assert ssmd.__version__ == distribution_version
          assert importlib.resources.files("ssmd").joinpath(
              "data/google-home.json"
          ).is_file()
          assert importlib.resources.files("ssmd").joinpath(
              "xsampa_to_ipa.txt"
          ).is_file()
          assert "<emphasis>" in ssmd.to_ssml("Hello *world*!")

          console_script = Path(sys.executable).with_name("ssmd")
          assert console_script.is_file(), f"missing installed console script: {console_script}"

          for command in (
              [sys.executable, "-m", "ssmd", "--json", "version"],
              [str(console_script), "--json", "version"],
          ):
              process = subprocess.run(command, check=True, text=True, capture_output=True)
              payload = json.loads(process.stdout)
              assert payload["ok"] is True
              assert payload["result"]["version"] == distribution_version
          PY

  integration:
    name: Optional ssml-maker integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[integration]" pytest
      - name: Run ssml-maker integration suite
        run: python -m pytest -q tests/test_roundtrip_ssml_maker.py
