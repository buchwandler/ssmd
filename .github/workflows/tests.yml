name: Test SSMD

on:
  push:
  pull_request:

jobs:
  base:
    name: Base runtime (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install base runtime and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov
      - name: Run base suite without spaCy
        run: python -m pytest -q

  minimum:
    name: Minimum supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependency floor
        run: |
          python -m pip install --upgrade pip
          python -m pip install "phrasplit==0.3.3" "pyyaml==6.0" "typer" "click" pytest
          python -m pip install -e . --no-deps
      - name: Run dependency-floor suite without spaCy
        run: python -m pytest -q

  spacy:
    name: Optional spaCy integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install spaCy extra and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[spacy,dev]"
          python -m spacy download en_core_web_sm
      - name: Run spaCy suite
        run: python -m pytest -q

  quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy ssmd
      - name: Compile sources
        run: python -m compileall -q ssmd

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install documentation tools
        run: python -m pip install -e ".[docs]"
      - name: Build documentation
        run: python -m sphinx --keep-going -b html docs docs/_build/html

  package:
    name: Package and installed-wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build artifacts
        run: python -m build
      - name: Validate artifact metadata
        run: python -m twine check dist/*
      - name: Inspect package artifacts
        run: python tools/check_artifacts.py dist/*
